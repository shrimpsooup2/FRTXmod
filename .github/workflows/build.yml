name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Consistency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # None of this needs a compiler, so running it first turns a class of
      # mistake into a ten second failure instead of a three minute one.
      - name: Verify generated files and shader uniforms
        run: python3 tools/check.py

  # Windows only, because mod.json declares only `win`. Building the other
  # targets tells us nothing about portability: they fail during CMake configure
  # with "JSON member 'gd mac' not found" before a single source file is
  # compiled. To add a platform, add it to `gd` in mod.json and add a job here.
  build:
    name: Windows
    needs: ['check']
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      # The action only uploads by itself when `combine` is set, which exists
      # for merging several platforms into one .geode. With a single platform
      # there is nothing to merge -- `geode package merge` refuses, since it
      # needs at least two -- so publish the built file directly instead.
      - name: Upload the packaged mod
        uses: actions/upload-artifact@v4
        with:
          name: FRTX
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
